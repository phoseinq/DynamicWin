name: CI

on:
  push:
    branches: [V3]
  pull_request:
    branches: [V3]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test-policy:
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: 9.0.x
          cache: true
          cache-dependency-path: '**/*.csproj'

      - name: Restore
        run: dotnet restore Halo.sln

      - name: Build
        run: dotnet build Halo.sln -c Release --no-restore --nologo -warnaserror

      - name: Test
        run: dotnet test tests\Halo.Tests\Halo.Tests.csproj -c Release --no-build --nologo

      - name: Check public source policy
        shell: pwsh
        run: pwsh -NoProfile -File scripts\verify-public-source.ps1
