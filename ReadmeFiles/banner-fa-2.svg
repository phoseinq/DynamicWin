<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340"
     font-family="Vazirmatn, 'Segoe UI', Tahoma, system-ui, sans-serif">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0"    stop-color="#0c1a19"/>
    <stop offset="0.55" stop-color="#071211"/>
    <stop offset="1"    stop-color="#050e0d"/>
  </linearGradient>
  <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0"    stop-color="#99f6e4"/>
    <stop offset="0.5"  stop-color="#2dd4bf"/>
    <stop offset="1"    stop-color="#0d5d55"/>
  </linearGradient>
  <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0"    stop-color="#115e59" stop-opacity="0"/>
    <stop offset="0.5"  stop-color="#2dd4bf"/>
    <stop offset="1"    stop-color="#115e59" stop-opacity="0"/>
  </linearGradient>
  <filter id="wide" x="-70%" y="-70%" width="240%" height="240%">
    <feGaussianBlur stdDeviation="58"/>
  </filter>
  <filter id="near" x="-80%" y="-80%" width="260%" height="260%">
    <feGaussianBlur stdDeviation="13"/>
  </filter>
  <clipPath id="card"><rect width="1200" height="340" rx="28"/></clipPath>
</defs>

<g clip-path="url(#card)">
  <rect width="1200" height="340" fill="url(#bg)"/>

  <!-- one ember behind the mark, clipped so it never bleeds past a rounded corner -->
  <ellipse cx="600" cy="120" rx="330" ry="140" fill="#2dd4bf" opacity=".17" filter="url(#wide)"/>
  <ellipse cx="600" cy="150" rx="150" ry="60"  fill="#5eead4" opacity=".10" filter="url(#wide)"/>

  <!-- ring and wordmark, centred on a measured width rather than a guessed one -->
  <circle cx="517" cy="118" r="25" fill="none" stroke="url(#ring)" stroke-width="7"/>
  <circle cx="517" cy="118" r="25" fill="none" stroke="#2dd4bf" stroke-width="11" opacity=".30" filter="url(#near)"/>
  <text x="564" y="138" fill="#f2fbfa" font-size="64" font-weight="800" letter-spacing="-1">Halo</text>

  <text x="600" y="188" fill="#c9e9e4" font-size="21" font-weight="600" text-anchor="middle">⁧یک قرصِ شیشه‌ای برای ویندوز — همان Dynamic Islandی که دسکتاپ هیچ‌وقت نداشت⁩</text>

  <text x="600" y="222" fill="#8bb8b2" font-size="16" text-anchor="middle">⁧آهنگی که پخش می‌شود را نشان می‌دهد، کدِ تأیید را از دلِ نوتیف بیرون می‌کشد، و فایل‌هایت را بین پنجره‌ها می‌برد⁩</text>

  <rect x="420" y="246" width="360" height="2" rx="1" fill="url(#rule)"/>

  <text x="600" y="280" fill="#3fd0bd" font-size="14" font-weight="700" text-anchor="middle">⁧مدیا · نوتیفیکیشن · فایل‌تری · دانلود · Claude و Codex⁩</text>

  <text x="600" y="308" fill="#5d817d" font-size="13" text-anchor="middle">⁧ویندوز ۱۱ · x64 · MIT · بدونِ حساب، بدونِ سرور، بدونِ تله‌متری⁩</text>
</g>
</svg>
