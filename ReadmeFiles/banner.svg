<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="380" viewBox="0 0 1200 380"
     font-family="'Segoe UI', system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0"   stop-color="#101013"/>
    <stop offset="0.6" stop-color="#0b0b0e"/>
    <stop offset="1"   stop-color="#0e0c09"/>
  </linearGradient>
  <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0"    stop-color="#8a6b02"/>
    <stop offset="0.35" stop-color="#c49b04"/>
    <stop offset="0.7"  stop-color="#f0b429"/>
    <stop offset="1"    stop-color="#8a6b02"/>
  </linearGradient>
  <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#ffd97a"/>
    <stop offset="1" stop-color="#c49b04"/>
  </linearGradient>
  <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#1c1b18"/>
    <stop offset="1" stop-color="#0a0a0c"/>
  </linearGradient>
  <linearGradient id="wave" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0"   stop-color="#f0b429"/>
    <stop offset="0.5" stop-color="#e8892b"/>
    <stop offset="1"   stop-color="#c49b04"/>
  </linearGradient>
  <filter id="wide" x="-60%" y="-60%" width="220%" height="220%">
    <feGaussianBlur stdDeviation="52"/>
  </filter>
  <filter id="near" x="-70%" y="-70%" width="240%" height="240%">
    <feGaussianBlur stdDeviation="14"/>
  </filter>
  <clipPath id="card"><rect width="1200" height="380" rx="30"/></clipPath>
</defs>

<g clip-path="url(#card)">
  <rect width="1200" height="380" fill="url(#bg)"/>

  <!-- warmth pooled under the notch, kept inside the clip so it never bleeds past a rounded corner -->
  <ellipse cx="600" cy="86"  rx="330" ry="150" fill="#c49b04" opacity=".16" filter="url(#wide)"/>
  <ellipse cx="600" cy="120" rx="180" ry="60"  fill="#f0b429" opacity=".13" filter="url(#wide)"/>

  <!-- The pill sits top-centre and flush to the edge, because that is exactly where it lives on a real
       screen: square shoulders against the bezel, only the underside curved. -->
  <path d="M450 0h300v52a48 48 0 0 1-48 48H498a48 48 0 0 1-48-48z" fill="url(#glass)"/>
  <path d="M450 0h300v52a48 48 0 0 1-48 48H498a48 48 0 0 1-48-48z" fill="none"
        stroke="#4a4133" stroke-width="1.4"/>
  <path d="M472 11h256" stroke="#ffffff" stroke-width="1.3" stroke-linecap="round" opacity=".10"/>

  <!-- what it carries, suggested rather than mocked up as a fake screenshot -->
  <g fill="url(#wave)">
    <rect x="506" y="44" width="6" height="14" rx="3"/>
    <rect x="519" y="36" width="6" height="30" rx="3"/>
    <rect x="532" y="29" width="6" height="44" rx="3"/>
    <rect x="545" y="39" width="6" height="24" rx="3"/>
    <rect x="558" y="33" width="6" height="36" rx="3"/>
    <rect x="571" y="43" width="6" height="16" rx="3"/>
  </g>
  <rect x="600" y="44" width="76" height="14" rx="7" fill="#332d20"/>
  <rect x="600" y="44" width="46" height="14" rx="7" fill="url(#gold)"/>
  <circle cx="700" cy="51" r="15" fill="#241f16"/>
  <path d="M700 44v13M694 51l6 6 6-6" stroke="#f0b429" stroke-width="2.2"
        stroke-linecap="round" stroke-linejoin="round" fill="none"/>

  <!-- wordmark, centred under the notch it belongs to -->
  <circle cx="517" cy="196" r="25" fill="none" stroke="url(#ring)" stroke-width="7"/>
  <circle cx="517" cy="196" r="25" fill="none" stroke="#f0b429" stroke-width="11" opacity=".22" filter="url(#near)"/>
  <text x="564" y="216" fill="#f7f4ec" font-size="64" font-weight="800" letter-spacing="-1">Halo</text>

  <text x="600" y="268" fill="#b9b09b" font-size="24" font-weight="600" text-anchor="middle">A glass notch for Windows</text>
  <text x="600" y="302" fill="#857d6c" font-size="19" text-anchor="middle">the Dynamic Island your desktop never got</text>

  <rect x="534" y="326" width="132" height="3" rx="1.5" fill="url(#gold)"/>

  <text x="600" y="358" fill="#6b6458" font-size="14" letter-spacing="1.6" text-anchor="middle">WINDOWS 11 · X64 · MIT · NO TELEMETRY</text>
</g>
</svg>
